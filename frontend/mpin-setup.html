<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Set M-PIN | Bitcoin Investment</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            font-family: "Inter", sans-serif;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            text-align: center;
            margin-bottom: 34px;
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            border-radius: 22px;
            background: #111111;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 800;
            box-shadow: 0 12px 30px rgba(0,0,0,.12);
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -.5px;
        }

        .brand p {
            margin-top: 8px;
            color: #777777;
            font-size: 14px;
            line-height: 1.5;
        }

        .card {
            border: 1px solid #eeeeee;
            border-radius: 24px;
            padding: 26px 22px;
            box-shadow: 0 15px 45px rgba(0,0,0,.06);
            background: #ffffff;
        }

        .title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777777;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 26px;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #cfcfcf;
            transition: .2s;
        }

        .dot.active {
            background: #111111;
            border-color: #111111;
            transform: scale(1.08);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 11px;
        }

        .key {
            height: 58px;
            border: 1px solid #eeeeee;
            border-radius: 16px;
            background: #fafafa;
            font-size: 21px;
            font-weight: 700;
            cursor: pointer;
            color: #111111;
            transition: .15s;
        }

        .key:active {
            transform: scale(.95);
            background: #eeeeee;
        }

        .key.delete {
            font-size: 19px;
        }

        .key.zero {
            grid-column: 2;
        }

        .message {
            min-height: 20px;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #777777;
        }

        .message.error {
            color: #d93025;
        }

        .message.success {
            color: #188038;
        }

        .continue-btn {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 15px;
            background: #111111;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            margin-top: 18px;
            cursor: pointer;
        }

        .continue-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .security {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #999999;
        }

        @media (max-width: 380px) {
            .container {
                padding: 24px 16px;
            }

            .card {
                padding: 22px 16px;
            }

            .key {
                height: 54px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">

        <div class="logo">₿</div>

        <h1>Bitcoin Investment</h1>

        <p>
            Secure access to your account
        </p>

    </div>


    <div class="card">

        <div class="title">
            Create your M-PIN
        </div>

        <div class="subtitle">
            Set a 4-digit M-PIN for quick and secure login.
            Your M-PIN is protected securely.
        </div>


        <div class="pin-dots">

            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>

        </div>


        <div class="keypad">

            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>

            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>

            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>

            <button
                class="key zero"
                onclick="pressKey('0')"
            >
                0
            </button>

            <button
                class="key delete"
                onclick="deleteKey()"
            >
                ⌫
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <button
            id="continueBtn"
            class="continue-btn"
            onclick="createMPin()"
            disabled
        >
            Create M-PIN
        </button>

    </div>


    <div class="security">
        🔒 Never share your M-PIN with anyone.
    </div>

</div>


<script>

const API_URL =
    "http://localhost:5000/api";


let pin = "";


const dots =
    document.querySelectorAll(".dot");

const message =
    document.getElementById("message");

const continueBtn =
    document.getElementById("continueBtn");


// =====================================================
// CHECK LOGIN TOKEN
// =====================================================

const token =
    localStorage.getItem("ki_token") ||
    localStorage.getItem("token");


if (!token) {

    window.location.replace("auth.html");

}


// =====================================================
// UPDATE DOTS
// =====================================================

function updateDots() {

    dots.forEach((dot, index) => {

        dot.classList.toggle(
            "active",
            index < pin.length
        );

    });


    continueBtn.disabled =
        pin.length !== 4;

}


// =====================================================
// PRESS NUMBER
// =====================================================

function pressKey(number) {

    if (pin.length >= 4) {
        return;
    }


    pin += number;

    message.textContent = "";
    message.className = "message";

    updateDots();

}


// =====================================================
// DELETE
// =====================================================

function deleteKey() {

    if (!pin.length) {
        return;
    }


    pin =
        pin.slice(0, -1);

    updateDots();

}


// =====================================================
// CREATE M-PIN
// =====================================================

async function createMPin() {

    if (pin.length !== 4) {

        return;

    }


    continueBtn.disabled = true;

    continueBtn.textContent =
        "Creating M-PIN...";


    message.textContent =
        "Securing your M-PIN...";

    message.className =
        "message";


    try {

        const response =
            await fetch(
                `${API_URL}/auth/set-mpin`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        mpin: pin
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Unable to create M-PIN."
            );

        }


        message.textContent =
            "M-PIN created successfully.";

        message.className =
            "message success";


        // =============================================
        // MARK M-PIN AS SET
        // =============================================

        localStorage.setItem(
            "mpin_set",
            "true"
        );


        // =============================================
        // GO HOME
        // =============================================

        setTimeout(() => {

            window.location.replace(
                "home.html"
            );

        }, 700);


    } catch (error) {

        console.error(
            "CREATE M-PIN ERROR:",
            error
        );


        message.textContent =
            error.message ||
            "Unable to create M-PIN.";

        message.className =
            "message error";


        pin = "";

        updateDots();


        continueBtn.disabled =
            true;

    }


    continueBtn.textContent =
        "Create M-PIN";

}

</script>

</body>
</html>
